name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: |
          dotnet pack Bonfire.Abstractions/Bonfire.Abstractions.csproj --configuration Release --no-build -o nupkgs /p:PackageVersion=${{ steps.version.outputs.VERSION }}
          dotnet pack Bonfire/Bonfire.csproj --configuration Release --no-build -o nupkgs /p:PackageVersion=${{ steps.version.outputs.VERSION }}
          dotnet pack Bonfire.Compiler.Roslyn/Bonfire.Compiler.Roslyn.csproj --configuration Release --no-build -o nupkgs /p:PackageVersion=${{ steps.version.outputs.VERSION }}
          dotnet pack Bonfire.Decompiler.IlSpy/Bonfire.Decompiler.IlSpy.csproj --configuration Release --no-build -o nupkgs /p:PackageVersion=${{ steps.version.outputs.VERSION }}
          dotnet pack Bonfire.LanguageModel.OpenAi/Bonfire.LanguageModel.OpenAi.csproj --configuration Release --no-build -o nupkgs /p:PackageVersion=${{ steps.version.outputs.VERSION }}
          dotnet pack Bonfire.All/Bonfire.All.csproj --configuration Release --no-build -o nupkgs /p:PackageVersion=${{ steps.version.outputs.VERSION }}

      - name: Push to NuGet
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
